name: Morning Dashboard Updater

on:
  schedule:
    - cron: '0 4 * * 1-5'
  workflow_dispatch:

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies
        run: npm install
        
      - name: Run Scraping and Email Script
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          BOSS_EMAIL: ${{ secrets.BOSS_EMAIL }}
        run: node daily_mailer.js
        
      - name: Save Website Changes to GitHub
        run: |
          git config --global user.name 'Intelligence Robot'
          git config --global user.email 'actions@github.com'
          git add index.html
          git commit -m "Automated Morning Price Update" || echo "No changes to commit"
          git push
